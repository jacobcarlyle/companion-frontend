<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#38a169">
  <title>Memory Chat</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-size: 20px;
      -webkit-tap-highlight-color: transparent;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    h1     { font-size: 28px; font-weight: 700; color: #2d3748; margin-bottom: 6px; }
    .greet { font-size: 20px; color: #4a5568; margin-bottom: 28px; line-height: 1.4; }
    #status { font-size: 18px; color: #4a5568; min-height: 26px; margin: 16px 0; }

    #talkBtn {
      width: 200px; height: 200px;
      border-radius: 50%;
      background: #38a169;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      border: none;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px;
      margin: 0 auto;
      box-shadow: 0 6px 20px rgba(56,161,105,0.40);
      transition: transform .15s, box-shadow .15s;
      cursor: pointer;
    }
    #talkBtn:active              { transform: scale(0.95); }
    #talkBtn.listening           { background: #e53e3e; animation: pulse 1.5s infinite; }
    #talkBtn.disabled            { background: #a0aec0; cursor: not-allowed; pointer-events: none; }
    #talkBtn .icon               { font-size: 52px; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 6px 20px rgba(229,62,62,0.4); }
      50%     { box-shadow: 0 6px 40px rgba(229,62,62,0.8); }
    }

    #transcript {
      background: #f7fafc;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 17px;
      color: #4a5568;
      line-height: 1.55;
      margin-top: 20px;
      min-height: 60px;
      max-height: 180px;
      overflow-y: auto;
      text-align: left;
      display: none;
    }
    #transcript p { margin-bottom: 8px; }
    #transcript p:last-child { margin-bottom: 0; }

    #endBtn {
      margin-top: 22px;
      background: #e2e8f0;
      color: #2d3748;
      font-size: 18px;
      font-weight: 600;
      padding: 16px 28px;
      border-radius: 40px;
      border: none;
      cursor: pointer;
      display: none;
      width: 100%;
    }
    #endBtn:active { background: #cbd5e0; }

    #talkBtn.thinking {
      background: #d69e2e;
      animation: pulse-think 1.8s infinite;
    }
    @keyframes pulse-think {
      0%,100% { box-shadow: 0 6px 20px rgba(214,158,46,0.4); }
      50%     { box-shadow: 0 6px 40px rgba(214,158,46,0.8); }
    }

    #pinDisplay {
      font-size: 52px;
      letter-spacing: 20px;
      padding: 20px 0;
      color: #2d3748;
      font-weight: 700;
    }
    #pinPad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 8px;
    }
    .pad {
      padding: 24px 0;
      font-size: 28px;
      font-weight: 700;
      border: 2px solid #cbd5e0;
      background: #fff;
      border-radius: 14px;
      color: #2d3748;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .pad:active { background: #e2e8f0; transform: scale(0.96); }
    .pad-clear, .pad-back { font-size: 20px; color: #4a5568; }
    #pinHint { margin-top: 16px; color: #4a5568; font-size: 16px; }
    #pinHint.err { color: #c53030; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Memory Chat</h1>
    <p class="greet" id="greet">Please enter your number</p>

    <!-- PIN gate — shown first -->
    <div id="pinGate">
      <div id="pinDisplay">----</div>
      <div id="pinPad">
        <button class="pad" data-d="1">1</button>
        <button class="pad" data-d="2">2</button>
        <button class="pad" data-d="3">3</button>
        <button class="pad" data-d="4">4</button>
        <button class="pad" data-d="5">5</button>
        <button class="pad" data-d="6">6</button>
        <button class="pad" data-d="7">7</button>
        <button class="pad" data-d="8">8</button>
        <button class="pad" data-d="9">9</button>
        <button class="pad pad-clear" id="pinClear">Clear</button>
        <button class="pad" data-d="0">0</button>
        <button class="pad pad-back" id="pinBack">←</button>
      </div>
      <p id="pinHint">Enter 4 numbers</p>
    </div>

    <!-- Chat controls — hidden until PIN verified -->
    <div id="chatControls" style="display:none">
      <button id="talkBtn" onclick="startSession()">
        <span class="icon">🎤</span>
        <span id="btnLabel">Tap to Chat</span>
      </button>
      <div id="status">Ready when you are</div>
      <div id="transcript"></div>
      <button id="endBtn" onclick="endSession()">Finish Chat</button>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
